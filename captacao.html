<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/favicon.png">
<title>Fale com o escritório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Identidade NXO */
  :root{
    --indigo:#4f46e5; --indigo-2:#6366f1; --navy:#1e1b4b;
    --ink:#17191c; --muted:#5b6270; --line:#e6e8ef; --bg-soft:#f5f6fa; --green:#16a34a;
  }
  *{box-sizing:border-box}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg-soft);margin:0;padding:40px 16px;-webkit-font-smoothing:antialiased}
  .nxo-card{max-width:460px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 24px 60px rgba(30,27,75,.12)}
  .nxo-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--indigo);background:#eceafc;padding:5px 11px;border-radius:20px;margin-bottom:14px}
  .nxo-card h1{font-size:22px;font-weight:800;margin:0 0 4px;line-height:1.2}
  .nxo-card p.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
  label{display:block;font-size:12px;font-weight:700;color:#41505f;margin:16px 0 6px}
  input,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
  textarea{min-height:92px;resize:vertical}
  button.nxo-btn{width:100%;margin-top:22px;background:var(--indigo);color:#fff;border:none;padding:14px;border-radius:11px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(79,70,229,.32);transition:background .15s,transform .1s}
  button.nxo-btn:hover{background:#4338ca;transform:translateY(-1px)}
  .nxo-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .nxo-ok{display:none;text-align:center;padding:30px 10px}
  .nxo-ok .ic{width:54px;height:54px;border-radius:50%;background:#eafaef;color:var(--green);font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-weight:800}
  .nxo-ok h2{margin:0 0 6px;font-size:18px}
  .nxo-ok p{color:var(--muted);font-size:14px;margin:0}
  .nxo-foot{text-align:center;margin-top:16px;font-size:11px;color:#9aa0b3}
/* A11y (invisível no uso normal): foco de teclado + respeito a reduced-motion */
:focus-visible{outline:2px solid var(--orange, var(--gold, var(--wine, #e07020)));outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  .reveal{opacity:1 !important;transform:none !important;transition:none !important}
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
  <div class="nxo-card">
    <span class="nxo-badge">Atendimento</span>
    <h1>Fale com o escritório</h1>
    <p class="sub">Conte seu caso e retornamos o contato o quanto antes.</p>

    <form id="nxoForm" onsubmit="return nxoEnviarLead(this)">
      <label>Nome*</label>
      <input name="nome" placeholder="Seu nome completo" required>

      <label>WhatsApp / telefone*</label>
      <input name="telefone" placeholder="(00) 00000-0000" required>

      <label>Assunto</label>
      <input name="area" placeholder="Ex: Trabalhista, Cível, Previdenciário...">

      <label>Mensagem</label>
      <textarea name="mensagem" placeholder="Descreva brevemente sua situação"></textarea>

      <!-- Honeypot anti-robô: NÃO remova. Fica invisível; se preenchido, o envio é descartado. -->
      <div class="nxo-hp"><input type="text" name="empresa_site" tabindex="-1" autocomplete="off"></div>

      <button type="submit" class="nxo-btn">Enviar contato</button>
    </form>

    <div class="nxo-ok" id="nxoOk">
      <div class="ic">✓</div>
      <h2>Recebemos seu contato!</h2>
      <p>Nossa equipe vai falar com você em breve.</p>
    </div>

    <div class="nxo-foot">Seus dados são usados apenas para retorno do atendimento.</div>
  </div>

<script>
  /* CONFIGURE AQUI (2 linhas) 
     1) NXO_TOKEN: pegue no CRM em "Funil Kanban" > botão "Captação do site".
     2) NXO_ENDPOINT: é o endereço do seu NXO + /api/lead-publico
        Ex.: se você acessa o CRM em https://nxo.suaempresa.com,
             o endpoint é https://nxo.suaempresa.com/api/lead-publico
 */
  var NXO_TOKEN    = "pJ45O_Uvp5xUThidZpHQKYoBWaGeMZiK";
  var NXO_ENDPOINT = "https://crm-agencia-master.onrender.com/api/lead-publico";

  function nxoEnviarLead(f){
    var d = { token: NXO_TOKEN };
    Array.prototype.forEach.call(f.elements, function(el){ if(el.name) d[el.name] = el.value; });
    fetch(NXO_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(d)
    })
    .then(function(r){ return r.json(); })
    .then(function(resp){
      if(resp && resp.erro){ alert(resp.erro); return; }
      f.style.display = "none";
      document.getElementById("nxoOk").style.display = "block";
    })
    .catch(function(){ alert("Não foi possível enviar agora. Tente novamente em instantes."); });
    return false;
  }
</script>
</body>
</html>
